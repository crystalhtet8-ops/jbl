<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MoneyFlow</title>

  <!-- Core styles -->
  <link rel="stylesheet" href="css/app.css">
  <!-- Non-invasive polish (quick-action pills, header stat spacing, loan BI, responsive tweaks) -->
  <link rel="stylesheet" href="css/ui-polish.css">

  <style>
    /* Minimal page layout to match the original app structure expectations */
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: var(--bg); color: var(--text); }
    header{padding:18px 20px; display:flex;align-items:center;gap:12px}
    .logo{display:flex;align-items:center;gap:10px}
    .logo img{width:34px;height:34px;display:block}
    .title{font-weight:800}
    nav{display:flex;gap:8px;margin-left:auto}
    nav button{background:transparent;border:0;padding:8px 10px;border-radius:10px;cursor:pointer}
    main{padding:20px}
    .page { display:none; }
    .page.active { display:block; }

    /* simple panel */
    .panel { padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line); }

    /* header stat group */
    .header-stats { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .header-stat { padding:8px 12px; border-radius:10px; background:var(--card); border:1px solid var(--line); text-align:center; min-width:100px; }
    .header-stat small { display:block; color:var(--muted); font-size:12px; }
    .header-stat strong { display:block; font-size:18px; margin-top:6px; }

    /* quick actions */
    .quick-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:12px; }
    .quick-actions button { border:0; background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px; }
    .quick-actions button .icon { width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; background:var(--soft); border:1px solid var(--line); }
    .quick-actions .label { font-size:12px; color:var(--text); }

    /* simple layout columns */
    .cols { display:grid; grid-template-columns: 1fr 360px; gap:16px; align-items:start; }
    @media (max-width:980px){ .cols { grid-template-columns:1fr; } }

    /* form fields */
    .field { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
    input, select, textarea, button { font:inherit; }
    input[type="text"], input[type="number"], input[type="date"], input[type="url"], select, textarea {
      padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text);
    }

    /* layout helpers */
    .muted { color:var(--muted); font-size:12px; }
    .flex { display:flex; gap:8px; align-items:center; }
    .right { margin-left:auto; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <!-- small app icon: replace src with icons/... if available in repo -->
      <img id="appIcon" src="icons/icon-small.png" alt="app icon" />
      <div>
        <div class="title">MoneyFlow</div>
        <div id="greet" class="muted">GOOD DAY</div>
      </div>
    </div>

    <nav>
      <button data-page="home">Home</button>
      <button data-page="add">Add</button>
      <button data-page="reports">Reports</button>
      <button data-page="settings">Settings</button>
    </nav>
  </header>

  <main>
    <!-- Home -->
    <section id="home" class="page active">
      <div class="panel">
        <div class="header-stats">
          <div id="income" class="header-stat"><small>Income</small><strong>0 MMK</strong></div>
          <div id="expense" class="header-stat"><small>Expense</small><strong>0 MMK</strong></div>
          <div id="loan" class="header-stat"><small>Loan</small><strong>0 MMK</strong></div>
          <div id="daily" class="header-stat"><small>Daily Budget</small><strong>0 MMK</strong></div>
          <div id="remaining" class="header-stat"><small>Remaining</small><strong>0 MMK</strong></div>
        </div>

        <div class="quick-actions">
          <button data-add="income" title="Add Income"><span class="icon">+</span><span class="label">Income</span></button>
          <button data-add="expense" title="Add Expense"><span class="icon">-</span><span class="label">Expense</span></button>
          <button data-add="loan" title="Add Loan"><span class="icon">L</span><span class="label">Loan</span></button>
          <button data-add="payback" title="Repay Loan"><span class="icon">R</span><span class="label">Repay</span></button>
        </div>
      </div>

      <div style="height:12px"></div>

      <div class="cols">
        <div>
          <div id="transactionsPanel" class="panel">
            <h3>Transactions</h3>
            <div id="txList" style="display:grid;gap:8px;margin-top:8px"></div>
          </div>

          <div style="height:12px"></div>

          <div id="budgetPanel" class="panel">
            <h3>Budgets</h3>
            <div id="budgetReport"></div>
          </div>
        </div>

        <aside>
          <div id="loanBI" class="panel">
            <h4>Loan Analysis</h4>
            <!-- rendered by JS -->
          </div>

          <div style="height:12px"></div>

          <div id="goalsPanel" class="panel">
            <h4>Goals</h4>
            <div id="goalsList" class="muted">No goals yet</div>
          </div>
        </aside>
      </div>
    </section>

    <!-- Add -->
    <section id="add" class="page">
      <div class="panel">
        <h3 id="formTitle">Add Transaction</h3>
        <form id="form">
          <div class="field">
            <label>Type</label>
            <div class="flex">
              <select id="type">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
                <option value="loan">Loan (received)</option>
                <option value="credit">Credit</option>
              </select>
              <input id="date" type="date" />
              <input id="amount" type="number" placeholder="Amount" />
            </div>
          </div>

          <div class="field">
            <label>Category / Note</label>
            <div class="flex">
              <select id="category"></select>
              <input id="note" type="text" placeholder="Note" />
            </div>
          </div>

          <!-- Loan repay selector injected here -->
          <div id="loanSelectHolder" class="field" style="display:none"></div>

          <div class="field">
            <button type="submit" class="save">Save</button>
            <button type="button" id="cancelAdd">Cancel</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Reports -->
    <section id="reports" class="page">
      <div class="panel">
        <h3>Reports</h3>
        <div id="reportArea" class="muted">Reports will appear here.</div>
      </div>
    </section>

    <!-- Settings -->
    <section id="settings" class="page">
      <div class="panel">
        <h3>Settings</h3>

        <div class="field">
          <label>Theme</label>
          <div class="flex">
            <button id="switch">Toggle Theme</button>
            <small class="muted">Current: <span id="currentTheme">light</span></small>
          </div>
        </div>

        <div class="field">
          <label>Google Apps Script URL (for sheet sync)</label>
          <input id="syncUrlInput" type="url" placeholder="https://script.google.com/..." />
          <div class="flex">
            <button id="saveSyncUrl">Save Sync URL</button>
            <button id="testSync">Test Sync</button>
            <small class="muted" id="syncStatus"></small>
          </div>
        </div>

        <div class="field">
          <label>Categories</label>
          <div id="categoriesList" class="muted">Categories managed in-app.</div>
        </div>

      </div>
    </section>
  </main>

  <div id="toast" class="panel" style="position:fixed;right:16px;bottom:16px;display:none"></div>

  <!-- App script -->
  <script src="js/app.js"></script>
</body>
</html>
